<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>About & Contact - My Portfolio</title>
</head>

<body>
    <header>
        <h1>About & Contact</h1>
        <nav aria-label="Main Navigation">
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects/Work</a></li>
                <li><a href="about.html">About/Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section>
            <h2>About Me</h2>
            <p>A brief bio/background information about me.</p>
        </section>

        <section>
            <h2>Get in Touch</h2>
            <form action="#" method="post" class="contact-form" novalidate>
                <fieldset>
                    <legend>Contact Form</legend>

                    <div class="form-group">
                        <label for="full-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="full-name" name="full-name" required aria-required="true" aria-describedby="name-error">
                        <p id="name-error" class="error-message" role="alert">Please enter your full name.</p>
                    </div>

                    <div class="form-group">
                        <label for="email-address">Email Address <span class="required">*</span></label>
                        <input type="email" id="email-address" name="email-address" required aria-required="true" aria-describedby="email-error">
                        <p id="email-error" class="error-message" role="alert">Please enter a valid email address.</p>
                    </div>

                    <div class="form-group">
                        <label for="user-message">Message <span class="required">*</span></label>
                        <textarea id="user-message" name="user-message" rows="5" required aria-required="true" aria-describedby="user-error"></textarea>
                        <p id="message-error" class="error-message" role="alert">Please enter your message.</p>
                    </div>

                    <button type="submit" class="btn-submit">Send Message</button>
                </fieldset>
            </form>
            <p>Contact Information will go here.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
